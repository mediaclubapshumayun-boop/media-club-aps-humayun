<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Election Results</title>

<!-- Chart.js (already used by you) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- ExcelJS (ONLY new thing added) -->
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
h1{
  text-align:center;
}
.section{
  background:#fff;
  padding:15px;
  margin-bottom:20px;
  border-radius:8px;
}
canvas{
  max-width:500px;
}
button{
  padding:10px 16px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>📊 Election Results</h1>

<div style="text-align:center;margin-bottom:20px">
  <button onclick="exportExcel()">⬇ Download Excel</button>
</div>

<div id="results"></div>

<script>
/* ===============================
   ADMIN PROTECTION (UNCHANGED)
================================ */
const ADMIN_PASSWORD = 'admin123';

if(!sessionStorage.getItem('admin')){
  const p = prompt('Enter admin password');
  if(p !== ADMIN_PASSWORD){
    alert('Access denied');
    location.href = 'index.html';
  }
  sessionStorage.setItem('admin','true');
}

/* ===============================
   LOAD VOTES (UNCHANGED)
================================ */
const logs = JSON.parse(localStorage.getItem('mc_votes_log') || '[]');
const container = document.getElementById('results');

if(!logs.length){
  container.innerHTML = '<p>No votes found.</p>';
}

/* ===============================
   GROUP VOTES (UNCHANGED)
================================ */
const grouped = {};
logs.forEach(v=>{
  const key = `${v.role} (${v.club || 'GLOBAL'})`;
  grouped[key] = grouped[key] || {};
  grouped[key][v.candidate] = (grouped[key][v.candidate] || 0) + 1;
});

/* ===============================
   DISPLAY CHARTS (UNCHANGED)
================================ */
Object.keys(grouped).forEach(role=>{
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<h3>${role}</h3><canvas></canvas>`;
  container.appendChild(sec);

  new Chart(sec.querySelector('canvas'),{
    type:'bar',
    data:{
      labels:Object.keys(grouped[role]),
      datasets:[{
        data:Object.values(grouped[role])
      }]
    },
    options:{
      responsive:true,
      plugins:{ legend:{ display:false } }
    }
  });
});

/* ===============================
   EXCEL EXPORT (NEW FEATURE)
================================ */
async function exportExcel(){
  if(!logs.length){
    alert('No votes found');
    return;
  }

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Election System';

  for(const role in grouped){
    const ws = wb.addWorksheet(role.substring(0,31));

    // Table
    ws.addRow(['Candidate','Votes']);
    Object.entries(grouped[role]).forEach(([name,count])=>{
      ws.addRow([name,count]);
    });

    ws.columns = [
      { width: 30 },
      { width: 10 }
    ];

    // Create chart image
    const canvas = document.createElement('canvas');
    new Chart(canvas.getContext('2d'),{
      type:'bar',
      data:{
        labels:Object.keys(grouped[role]),
        datasets:[{ data:Object.values(grouped[role]) }]
      }
    });

    const img = wb.addImage({
      base64: canvas.toDataURL(),
      extension: 'png'
    });

    ws.addImage(img,{
      tl:{ col:4, row:1 },
      ext:{ width:450, height:300 }
    });
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer],{
    type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Election_Results.xlsx';
  a.click();
}
</script>

</body>
</html>
