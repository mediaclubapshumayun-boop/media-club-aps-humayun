<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Media Club Election Results — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>

  <!-- ExcelJS + FileSaver -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Inter,sans-serif;
      background:#0b1220;
      color:#e5e7eb;
    }
    .container{max-width:1200px;margin:auto;padding:20px}
    h1{font-weight:800}
    .controls{margin:12px 0;display:flex;gap:10px}
    button{
      padding:10px 14px;
      border-radius:10px;
      border:none;
      font-weight:700;
      cursor:pointer;
    }
    .brand{background:#4f46e5;color:#fff}
    .danger{background:#b91c1c;color:#fff}
    .card{background:#fff;color:#000;border-radius:12px;padding:14px;margin-top:14px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #e5e7eb}
    th{background:#f1f5f9}
    .winner{
      background:#d1fae5;
      color:#065f46;
      padding:2px 6px;
      border-radius:999px;
      font-size:11px;
      margin-left:6px;
      font-weight:800;
    }
    canvas{max-height:320px}
  </style>
</head>

<body>
<div class="container">
  <h1>📊 Media Club Election Results (Admin)</h1>

  <div class="controls">
    <button id="btnExport" class="brand">⬇️ Export Excel (.xlsx)</button>
    <button id="btnReset" class="danger">🔄 Reset All Votes</button>
  </div>

  <div id="rolesContainer"></div>
</div>

<script>
/* ==========================
   Utilities & Storage
========================== */
const chartsByRole = new Map();
const $ = s => document.querySelector(s);

function safeJSON(v){
  try { return JSON.parse(v); } catch { return null; }
}

function readRoleTallies(){
  const map = new Map();

  const ballots = safeJSON(localStorage.getItem('mc_votes_log')) || [];
  ballots.forEach(v=>{
    if(!v?.candidate) return;
    const role = v.role || 'PRESIDENT';
    const m = map.get(role) || new Map();
    m.set(v.candidate,(m.get(v.candidate)||0)+1);
    map.set(role,m);
  });

  return map;
}

/* ==========================
   Rendering
========================== */
function render(){
  const data = readRoleTallies();
  const container = $('#rolesContainer');
  container.innerHTML = '';

  if(!data.size){
    container.innerHTML = '<div class="card">No votes yet.</div>';
    return;
  }

  for(const [role,cands] of data){
    const rows = [...cands.entries()].sort((a,b)=>b[1]-a[1]);
    const total = rows.reduce((s,[,v])=>s+v,0);

    const card = document.createElement('div');
    card.className='card';

    card.innerHTML = `<h3>${role}</h3>`;

    const table = document.createElement('table');
    table.innerHTML = `
      <thead>
        <tr><th>#</th><th>Candidate</th><th>Votes</th><th>%</th></tr>
      </thead>
      <tbody></tbody>`;
    const tb = table.querySelector('tbody');

    rows.forEach(([n,v],i)=>{
      tb.innerHTML += `
        <tr>
          <td>${i+1}</td>
          <td>${n}${i===0?'<span class="winner">Winner</span>':''}</td>
          <td>${v}</td>
          <td>${((v/total)*100).toFixed(1)}%</td>
        </tr>`;
    });

    card.appendChild(table);

    const canvas = document.createElement('canvas');
    card.appendChild(canvas);

    container.appendChild(card);

    const chart = new Chart(canvas,{
      type:'bar',
      data:{
        labels:rows.map(r=>r[0]),
        datasets:[{label:'Votes',data:rows.map(r=>r[1])}]
      },
      options:{responsive:true,scales:{y:{beginAtZero:true}}}
    });

    chartsByRole.set(role,{chart,canvas});
  }
}

/* ==========================
   Excel Export (WORKING)
========================== */
async function exportExcel(){
  if(typeof ExcelJS==='undefined' || typeof saveAs==='undefined'){
    alert('Excel libraries failed to load');
    return;
  }

  const data = readRoleTallies();
  if(!data.size){
    alert('No data to export');
    return;
  }

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Media Club';

  for(const [role,cands] of data){
    const ws = wb.addWorksheet(role.slice(0,31));
    const rows = [...cands.entries()].sort((a,b)=>b[1]-a[1]);
    const total = rows.reduce((s,[,v])=>s+v,0);

    ws.columns = [
      {header:'Rank',width:8},
      {header:'Candidate',width:26},
      {header:'Votes',width:10},
      {header:'% Share',width:12}
    ];

    rows.forEach(([n,v],i)=>{
      ws.addRow([i+1,n,v,v/total]);
    });

    ws.getRow(1).font={bold:true};
    ws.getColumn(4).numFmt='0.0%';

    const ch = chartsByRole.get(role);
    if(ch){
      const img = wb.addImage({
        base64: ch.canvas.toDataURL().split(',')[1],
        extension:'png'
      });
      ws.addImage(img,{tl:{col:5,row:1},ext:{width:400,height:260}});
    }
  }

  const buf = await wb.xlsx.writeBuffer();
  saveAs(
    new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
    `MediaClub_Results_${new Date().toISOString().slice(0,10)}.xlsx`
  );
}

/* ==========================
   Boot (FIXED)
========================== */
function boot(){
  // Attach handlers FIRST
  $('#btnExport').addEventListener('click', exportExcel);
  $('#btnReset').addEventListener('click', ()=>{
    localStorage.removeItem('mc_votes_log');
    render();
  });

  // Password
  const pwd = prompt('Enter admin password');
  if(pwd!=='123'){
    alert('Wrong password');
    location.href='index.html';
    return;
  }

  render();
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
