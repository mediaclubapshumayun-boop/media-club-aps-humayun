<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Election Results</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #f4f6f8;
}
h1{
  text-align: center;
}
.section{
  background: white;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 8px;
}
canvas{
  max-width: 500px;
}
button{
  padding: 10px 16px;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>📊 Election Results</h1>

<div style="text-align:center;margin-bottom:20px">
  <button onclick="exportExcel()">⬇ Download Results (Excel)</button>
</div>

<div id="results"></div>

<script>
// 🔐 ADMIN PASSWORD
const ADMIN_PASSWORD = 'admin123';

// 🔒 Simple protection
if(!sessionStorage.getItem('admin')){
  const p = prompt('Enter admin password');
  if(p !== ADMIN_PASSWORD){
    alert('Access denied');
    location.href = 'index.html';
  }
  sessionStorage.setItem('admin','true');
}

// 📥 Load votes
const logs = JSON.parse(localStorage.getItem('mc_votes_log') || '[]');
const container = document.getElementById('results');

if(!logs.length){
  container.innerHTML = '<p>No votes found.</p>';
}

// 📊 Group votes
const grouped = {};
logs.forEach(v=>{
  const key = `${v.role} (${v.club || 'GLOBAL'})`;
  grouped[key] = grouped[key] || {};
  grouped[key][v.candidate] = (grouped[key][v.candidate] || 0) + 1;
});

// 🖥️ Display charts
Object.keys(grouped).forEach(role=>{
  const sec = document.createElement('div');
  sec.className = 'section';

  sec.innerHTML = `<h3>${role}</h3><canvas></canvas>`;
  container.appendChild(sec);

  const labels = Object.keys(grouped[role]);
  const data = Object.values(grouped[role]);

  new Chart(sec.querySelector('canvas'),{
    type:'bar',
    data:{
      labels,
      datasets:[{ data }]
    },
    options:{
      responsive:true,
      plugins:{ legend:{ display:false } }
    }
  });
});

// 📤 EXPORT TO EXCEL
async function exportExcel(){
  if(!logs.length){
    alert('No votes to export');
    return;
  }

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Election System';

  for(const role in grouped){
    const ws = wb.addWorksheet(role.substring(0,31));

    ws.addRow(['Candidate','Votes']);
    Object.entries(grouped[role]).forEach(([c,v])=>{
      ws.addRow([c,v]);
    });

    ws.columns = [
      { width: 30 },
      { width: 10 }
    ];

    // Create chart image
    const canvas = document.createElement('canvas');
    new Chart(canvas.getContext('2d'),{
      type:'bar',
      data:{
        labels:Object.keys(grouped[role]),
        datasets:[{ data:Object.values(grouped[role]) }]
      }
    });

    const img = wb.addImage({
      base64: canvas.toDataURL(),
      extension:'png'
    });

    ws.addImage(img,{
      tl:{ col:4, row:1 },
      ext:{ width:450, height:300 }
    });
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer],{
    type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Election_Results.xlsx';
  a.click();
}
</script>

</body>
</html>
