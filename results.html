<script>
async function exportExcel(){
  const tallies = readRoleTallies();
  const ballots = safeJSON(localStorage.getItem('mc_votes_log')) || [];
  const keys = [...tallies.keys()];

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Media Club Elections';
  wb.created = new Date();

  /***********************
   * ROLE RESULT SHEETS
   ***********************/
  for(const rk of keys){
    const ws = wb.addWorksheet(roleTitle(rk).slice(0,31));
    const rows = [...tallies.get(rk).entries()].sort((a,b)=>b[1]-a[1]);
    const total = rows.reduce((s,[,c])=>s+c,0);

    ws.columns = [
      { header:'Rank', key:'rank', width:8 },
      { header:'Candidate', key:'cand', width:28 },
      { header:'Votes', key:'cnt', width:12 },
      { header:'% Share', key:'pct', width:12 }
    ];

    rows.forEach(([cand,cnt],i)=>{
      ws.addRow({
        rank: i+1,
        cand,
        cnt,
        pct: total ? cnt/total : 0
      });
    });

    ws.getRow(1).font = { bold:true };
    ws.getColumn(4).numFmt = '0.0%';

    ws.addRow([]);
    ws.addRow(['Role Key', rk]);
    ws.addRow(['Total Votes', total]);

    // Embed charts
    const ch = chartsByRole.get(rk);
    if(ch?.pie?.canvas){
      const img = wb.addImage({
        base64: ch.pie.canvas.toDataURL('image/png').split(',')[1],
        extension:'png'
      });
      ws.addImage(img,{ tl:{ col:6, row:1 }, ext:{ width:420, height:280 } });
    }
    if(ch?.bar?.canvas){
      const img2 = wb.addImage({
        base64: ch.bar.canvas.toDataURL('image/png').split(',')[1],
        extension:'png'
      });
      ws.addImage(img2,{ tl:{ col:6, row:18 }, ext:{ width:420, height:280 } });
    }
  }

  /***********************
   * RAW VOTES SHEET
   ***********************/
  const raw = wb.addWorksheet('Raw Votes');
  raw.columns = [
    { header:'Student Name', key:'name', width:24 },
    { header:'Class', key:'class', width:12 },
    { header:'Section', key:'section', width:12 },
    { header:'House', key:'house', width:14 },
    { header:'Club', key:'club', width:20 },
    { header:'Role', key:'role', width:18 },
    { header:'Candidate', key:'candidate', width:24 },
    { header:'Time', key:'time', width:22 }
  ];
  raw.getRow(1).font = { bold:true };

  ballots.forEach(v=>{
    raw.addRow({
      name: v.name || '',
      class: v.class || '',
      section: v.section || '',
      house: v.house || '',
      club: v.club || '',
      role: v.role || v.position || '',
      candidate: v.candidate || '',
      time: v.time || ''
    });
  });

  /***********************
   * SUMMARY SHEET
   ***********************/
  const sum = wb.addWorksheet('Summary');
  sum.addRow(['Media Club Elections – Final Export']);
  sum.getRow(1).font = { bold:true, size:14 };
  sum.addRow(['Exported On', new Date().toLocaleString()]);
  sum.addRow(['Total Roles', keys.length]);
  sum.addRow(['Total Votes', ballots.length]);

  /***********************
   * FORCE DOWNLOAD
   ***********************/
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob(
    [buffer],
    { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }
  );

  saveAs(
    blob,
    `MediaClub_Election_Results_${new Date().toISOString().slice(0,10)}.xlsx`
  );
}
</script>
