<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Media Club Election Results (Admin)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<!-- PowerPoint -->
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#0b1220;
  color:#e5e7eb;
}
.container{max-width:1200px;margin:auto;padding:20px}
h1{font-weight:800}
.controls{display:flex;gap:10px;margin:14px 0}
button{
  padding:10px 14px;
  border-radius:10px;
  border:none;
  font-weight:700;
  cursor:pointer;
}
.brand{background:#4f46e5;color:#fff}
.danger{background:#b91c1c;color:#fff}
.card{
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:16px;
  margin-top:20px;
}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #e5e7eb}
th{background:#f1f5f9}
.winner{
  background:#d1fae5;
  color:#065f46;
  padding:2px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  margin-left:6px;
}
canvas{max-height:300px;margin-top:14px}
</style>
</head>

<body>
<div class="container">
  <h1>📊 Media Club Election Results (Admin)</h1>

  <div class="controls">
    <button id="btnExcel" class="brand">⬇ Export Excel</button>
    <button id="btnPPT" class="brand">📽 Export PowerPoint</button>
    <button id="btnReset" class="danger">🔄 Reset Votes</button>
  </div>

  <div id="roles"></div>
</div>

<script>
/* ===============================
   AUTH
================================ */
const pwd = prompt("Enter admin password");
if(pwd !== "123"){
  alert("Wrong password");
  location.href="index.html";
}

/* ===============================
   DATA
================================ */
const charts = new Map();
function safeJSON(v){ try{return JSON.parse(v)}catch{return null} }

function readVotes(){
  const map = new Map();
  const votes = safeJSON(localStorage.getItem("mc_votes_log")) || [];
  votes.forEach(v=>{
    if(!v?.candidate) return;
    const role = v.role || "PRESIDENT";
    const m = map.get(role) || new Map();
    m.set(v.candidate,(m.get(v.candidate)||0)+1);
    map.set(role,m);
  });
  return map;
}

/* ===============================
   RENDER
================================ */
function render(){
  const data = readVotes();
  const root = document.getElementById("roles");
  root.innerHTML = "";

  if(!data.size){
    root.innerHTML = '<div class="card">No votes yet</div>';
    return;
  }

  for(const [role,cands] of data){
    const rows=[...cands.entries()].sort((a,b)=>b[1]-a[1]);
    const total=rows.reduce((s,[,v])=>s+v,0);

    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`<h3>${role}</h3>`;

    const table=document.createElement("table");
    table.innerHTML='<thead><tr><th>#</th><th>Candidate</th><th>Votes</th><th>%</th></tr></thead><tbody></tbody>';
    const tb=table.querySelector("tbody");

    rows.forEach(([n,v],i)=>{
      tb.innerHTML+=`
      <tr>
        <td>${i+1}</td>
        <td>${n}${i===0?'<span class="winner">Winner</span>':''}</td>
        <td>${v}</td>
        <td>${((v/total)*100).toFixed(1)}%</td>
      </tr>`;
    });

    card.appendChild(table);

    const canvas=document.createElement("canvas");
    card.appendChild(canvas);
    root.appendChild(card);

    const chart=new Chart(canvas,{
      type:"bar",
      data:{labels:rows.map(r=>r[0]),datasets:[{label:"Votes",data:rows.map(r=>r[1])}]},
      options:{responsive:true,scales:{y:{beginAtZero:true}}}
    });

    charts.set(role,{rows,total});
  }
}
render();

/* ===============================
   EXCEL EXPORT
================================ */
async function exportExcel(){
  const data = readVotes();
  if(!data.size) return alert("No data");

  const wb = new ExcelJS.Workbook();
  wb.creator="Media Club";

  for(const [role,cands] of data){
    const ws = wb.addWorksheet(role.slice(0,31));
    const rows=[...cands.entries()].sort((a,b)=>b[1]-a[1]);
    const total=rows.reduce((s,[,v])=>s+v,0);

    ws.addRow(["#","Candidate","Votes","%"]);
    ws.getRow(1).font={bold:true};

    rows.forEach(([n,v],i)=>{
      ws.addRow([i+1,n,v,v/total]);
    });
    ws.getColumn(4).numFmt="0.0%";
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf],{
    type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="MediaClub_Results.xlsx";
  a.click();
}

/* ===============================
   POWERPOINT EXPORT (BEAUTIFUL)
================================ */
function exportPPT(){
  const data = readVotes();
  if(!data.size) return alert("No data");

  const ppt = new PptxGenJS();

  /* COVER */
  const cover = ppt.addSlide();
  cover.background={fill:"0B1220"};
  cover.addText("Media Club Elections 2025",{x:1,y:1.6,w:8,fontSize:36,bold:true,color:"FFFFFF",align:ppt.AlignH.center});
  cover.addText("Official Results",{x:1,y:2.6,w:8,fontSize:18,color:"CBD5E1",align:ppt.AlignH.center});

  /* ROLE SLIDES */
  for(const [role,cands] of data){
    const rows=[...cands.entries()].sort((a,b)=>b[1]-a[1]);
    const total=rows.reduce((s,[,v])=>s+v,0);
    const winner=rows[0];
    const losers=rows.slice(1);

    const slide=ppt.addSlide();

    slide.addShape(ppt.ShapeType.rect,{x:0,y:0,w:"100%",h:0.8,fill:{color:"4F46E5"}});
    slide.addText(role,{x:0.4,y:0.18,w:9,fontSize:22,bold:true,color:"FFFFFF"});

    slide.addText("🏆 WINNER",{x:0.4,y:1.1,fontSize:14,bold:true,color:"065F46"});
    slide.addText(winner[0],{x:0.4,y:1.5,fontSize:24,bold:true});
    slide.addText(`Votes: ${winner[1]} (${((winner[1]/total)*100).toFixed(1)}%)`,
      {x:0.4,y:2.1,fontSize:14});

    if(losers.length){
      slide.addText("Other Candidates",{x:0.4,y:2.8,fontSize:14,bold:true});
      slide.addText(
        losers.map(([n,v])=>`${n} — ${v} votes`).join("\n"),
        {x:0.4,y:3.1,fontSize:12}
      );
    }

    slide.addChart(ppt.ChartType.pie,[{
      labels:rows.map(r=>r[0]),
      values:rows.map(r=>r[1])
    }],{x:5.2,y:1,w:4.3,h:3});

    slide.addChart(ppt.ChartType.bar,[{
      labels:rows.map(r=>r[0]),
      values:rows.map(r=>r[1])
    }],{x:5.2,y:4.2,w:4.3,h:2.2});
  }

  ppt.writeFile("MediaClub_Results.pptx");
}

/* ===============================
   EVENTS
================================ */
document.getElementById("btnExcel").onclick=exportExcel;
document.getElementById("btnPPT").onclick=exportPPT;
document.getElementById("btnReset").onclick=()=>{
  localStorage.removeItem("mc_votes_log");
  render();
};
</script>
</body>
</html>
