<script>
function exportPPT(){
  const data = readVotes();
  if(!data.size) return alert('No data');

  const ppt = new PptxGenJS();

  /* ===============================
     COVER SLIDE
  ============================== */
  const cover = ppt.addSlide();
  cover.background = { fill: '0B1220' };
  cover.addText('Media Club Elections 2025', {
    x: 1, y: 1.6, w: 8,
    fontSize: 36, bold: true, color: 'FFFFFF',
    align: ppt.AlignH.center
  });
  cover.addText('Official Results', {
    x: 1, y: 2.6, w: 8,
    fontSize: 18, color: 'CBD5E1',
    align: ppt.AlignH.center
  });
  cover.addText(new Date().toLocaleString(), {
    x: 1, y: 3.2, w: 8,
    fontSize: 12, color: '94A3B8',
    align: ppt.AlignH.center
  });

  /* ===============================
     ROLE SLIDES
  ============================== */
  for(const [role, cands] of data){
    const rows = [...cands.entries()].sort((a,b)=>b[1]-a[1]);
    const total = rows.reduce((s,[,v])=>s+v,0);
    const winner = rows[0];
    const losers = rows.slice(1);

    const slide = ppt.addSlide();

    /* Header Bar */
    slide.addShape(ppt.ShapeType.rect, {
      x: 0, y: 0, w: '100%', h: 0.8,
      fill: { color: '4F46E5' }
    });

    slide.addText(role, {
      x: 0.4, y: 0.18, w: 9,
      fontSize: 22, bold: true, color: 'FFFFFF'
    });

    /* Winner Box */
    slide.addShape(ppt.ShapeType.rect, {
      x: 0.4, y: 1.1, w: 4.6, h: 1.4,
      fill: { color: 'ECFDF5' },
      line: { color: '10B981' }
    });

    slide.addText('🏆 WINNER', {
      x: 0.6, y: 1.2, fontSize: 14,
      bold: true, color: '065F46'
    });

    slide.addText(`${winner[0]}`, {
      x: 0.6, y: 1.6, fontSize: 22,
      bold: true, color: '064E3B'
    });

    slide.addText(
      `Votes: ${winner[1]} (${((winner[1]/total)*100).toFixed(1)}%)`,
      { x: 0.6, y: 2.1, fontSize: 14, color: '065F46' }
    );

    /* Losers */
    if(losers.length){
      slide.addText('Other Candidates', {
        x: 0.4, y: 2.8,
        fontSize: 14, bold: true
      });

      slide.addText(
        losers.map(
          ([n,v])=>`${n} — ${v} votes (${((v/total)*100).toFixed(1)}%)`
        ).join('\n'),
        { x: 0.4, y: 3.1, fontSize: 12 }
      );
    }

    /* Pie Chart */
    slide.addChart(
      ppt.ChartType.pie,
      [{
        labels: rows.map(r=>r[0]),
        values: rows.map(r=>r[1])
      }],
      {
        x: 5.3, y: 1.1, w: 4.3, h: 3,
        showLegend: true,
        legendPos: 'b',
        dataLabelColor: 'FFFFFF'
      }
    );

    /* Bar Chart */
    slide.addChart(
      ppt.ChartType.bar,
      [{
        labels: rows.map(r=>r[0]),
        values: rows.map(r=>r[1])
      }],
      {
        x: 5.3, y: 4.3, w: 4.3, h: 2.2,
        barDir: 'col',
        showLegend: false,
        catAxisLabelColor: '334155',
        valAxisLabelColor: '334155'
      }
    );
  }

  ppt.writeFile('MediaClub_Election_Results.pptx');
}
</script>
